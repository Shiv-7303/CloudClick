<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template 8 - Type-Only Manifesto</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #1a1a1a; padding: 50px; display: flex; flex-direction: column; gap: 40px; align-items: center; }
        
        .slide {
            width: 1080px; height: 1080px;
            background-color: #111111; position: relative; overflow: hidden;
            font-family: 'Inter', sans-serif; color: #fff;
        }

        .top-bar {
            position: absolute; top: 60px; left: 60px; right: 60px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            color: rgba(255,255,255,0.5); z-index: 20;
        }

        .content-area {
            position: absolute;
            top: 150px; bottom: 120px; left: 0; right: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 60px;
            z-index: 10;
        }

        .headline-wrapper {
            width: 1200px; /* Intentionally wider than slide to bleed off edges */
            text-align: center;
            display: flex;
            justify-content: center;
        }

        .headline {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 210px; /* Scaled down slightly to prevent overlap */
            line-height: 0.85; text-transform: uppercase;
            color: #fff;
            display: flex; flex-direction: column;
        }

        /* Accent word highlight */
        .headline .accent {
            color: #ff3b30; /* Urgent Red */
        }

        .body-text-wrapper {
            width: 1080px;
            display: flex; justify-content: center; z-index: 20;
        }

        .body-text {
            font-size: 32px; font-weight: 500; line-height: 1.4; color: #fff;
            max-width: 800px; text-align: center;
        }

        .footer {
            position: absolute; bottom: 60px; left: 0; width: 1080px;
            text-align: center; font-size: 20px; font-weight: 700;
            color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 5px;
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="top-bar">
            <span>01/05</span>
            <span>@CLOUDCLICK</span>
        </div>

        <div class="content-area">
            <div class="headline-wrapper">
                <div class="headline">
                    <span>PEOPLE</span>
                    <span class="accent">DON'T CARE</span>
                    <span>ABOUT YOU</span>
                </div>
            </div>

            <div class="body-text-wrapper">
                <div class="body-text">
                    They care about what you can do for them. Stop talking about yourself and start solving their problems.
                </div>
            </div>
        </div>

        <div class="footer">
            SWIPE TO LEARN HOW
        </div>
    </div>
</body>
</html>
