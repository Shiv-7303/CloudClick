<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Box Prototype (Template 3)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #333;
            padding: 50px;
            display: flex;
            flex-direction: row; /* Changed to row to see the connection */
            gap: 0px; /* Zero gap so we can see how they connect side-by-side */
            justify-content: center;
        }

        /* 
         * SLIDE CONTAINER (1080x1080)
         */
        .slide {
            width: 1080px;
            height: 1080px;
            background-color: #D4E149; 
            position: relative;
            overflow: hidden;
            color: #000000; 
            flex-shrink: 0;
            border-right: 1px dashed rgba(0,0,0,0.1); /* Helper line to see slide boundary */
        }
        
        .slide.light {
            background-color: #F8F9F3; 
        }

        /* 
         * HAND-DRAWN BACKGROUND SHAPES
         */
        .bg-shape {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            opacity: 0.08; /* Reduced opacity */
        }
        
        .bg-shape svg {
            width: 100%;
            height: 100%;
            stroke: #000;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 20 20; /* Dotted line style for the connecting thread */
        }

        /* 
         * TOP BAR
         */
        .top-bar {
            position: absolute;
            top: 70px;
            left: 80px;
            right: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 28px;
            letter-spacing: 0.02em;
            z-index: 20;
        }

        /* 
         * CONTENT WRAPPER 
         */
        .content {
            position: absolute;
            top: 240px;
            left: 0;
            width: 1080px;
            padding: 0 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        
        .content.centered {
            align-items: center;
            text-align: center;
            top: 180px;
            padding: 0 100px;
        }

        /* 
         * HEADLINES
         */
        .headline-hook {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 135px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.02em;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .box-highlight {
            background-color: #FFFFFF;
            color: #000000;
            border: 5px solid #000000;
            padding: 0 25px;
            margin: 15px 0;
            display: inline-block;
            line-height: 1.1;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
        }

        .headline-content {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 110px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            margin-top: 30px;
        }

        /* 
         * BODY TEXT
         */
        .body-text {
            font-family: 'DM Sans', sans-serif;
            font-size: 42px;
            font-weight: 500;
            color: #333333;
            line-height: 1.45;
        }

        /* 
         * ILLUSTRATION PLACEHOLDER 
         */
        .illustration {
            width: 320px;
            height: 320px;
            margin-bottom: 10px;
        }

        /* 
         * FOOTER
         */
        .footer {
            position: absolute;
            bottom: 70px;
            left: 80px;
            right: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .swipe-text {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 38px;
            font-weight: 700;
        }

        /* 
         * SWIPE ICON
         */
        .swipe-icon {
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .arrow-circle {
            background-color: #000;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1;
        }
        
        .arrow-circle svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: white;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hand-pointer {
            position: absolute;
            left: -85px;
            top: 25px;
            width: 110px;
            height: 110px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- SLIDE 1: THE HOOK -->
    <div class="slide">
        <!-- Connecting thread exiting right -->
        <div class="bg-shape" style="top: 200px; left: 0; width: 1080px; height: 1080px;">
            <svg viewBox="0 0 1080 1080">
                <!-- Starts in the middle, loops around, and exits at exactly Y=800 on the right edge -->
                <path d="M 200,800 C 400,900 800,400 600,200 C 400,0 200,300 500,600 C 700,800 900,750 1080,800" />
                
                <!-- Little stars floating around the thread -->
                <path d="M 300,300 L 310,320 L 330,325 L 310,330 L 300,350 L 290,330 L 270,325 L 290,320 Z" stroke="none" fill="#000" opacity="0.3"/>
                <path d="M 800,600 L 805,610 L 815,612 L 805,615 L 800,625 L 795,615 L 785,612 L 795,610 Z" stroke="none" fill="#000" opacity="0.3"/>
            </svg>
        </div>

        <div class="top-bar">
            <span>@CLOUDCLICK</span>
            <span>Content Creator</span>
        </div>

        <div class="content">
            <div class="headline-hook">
                <span>Things to</span>
                <span class="box-highlight">understand</span>
                <span>about your</span>
                <span>audience</span>
            </div>
        </div>

        <div class="footer">
            <div class="swipe-text">Swipe for more</div>
            <div class="swipe-icon">
                <svg class="hand-pointer" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
                        <path d="M104,136 V56 a20,20 0 0 1 40,0 v48 M144,96 v-12 a20,20 0 0 1 40,0 v32 M184,104 v-8 a20,20 0 0 1 40,0 v48 c0,32 -20,64 -48,64 H128 C88,208 64,176 64,144 L44,112 a20,20 0 0 1 32,-20 L104,136" />
                    </g>
                    <path d="M124,16 V32 M80,36 L92,48 M168,36 L156,48" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
                </svg>
                <div class="arrow-circle">
                    <svg viewBox="0 0 24 24">
                        <path d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </div>
            </div>
        </div>
    </div>


    <!-- SLIDE 2: THE CONTENT -->
    <div class="slide light">
        <!-- Connecting thread entering from left -->
        <div class="bg-shape" style="top: 200px; left: 0; width: 1080px; height: 1080px;">
            <svg viewBox="0 0 1080 1080">
                <!-- Enters at exactly Y=800 on the left edge, loops up, and exits right -->
                <path d="M 0,800 C 200,850 400,600 300,400 C 200,200 600,100 800,300 C 1000,500 900,800 1080,750" />
                
                <path d="M 200,600 L 210,620 L 230,625 L 210,630 L 200,650 L 190,630 L 170,625 L 190,620 Z" stroke="none" fill="#000" opacity="0.3"/>
                <path d="M 850,250 L 855,260 L 865,262 L 855,265 L 850,275 L 845,265 L 835,262 L 845,260 Z" stroke="none" fill="#000" opacity="0.3"/>
            </svg>
        </div>

        <div class="top-bar">
            <span>@CLOUDCLICK</span>
            <span>Content Creator</span>
        </div>

        <div class="content centered">
            <svg class="illustration" viewBox="0 0 100 100" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="50" cy="50" r="40" fill="#fff" />
                <path d="M30 50 Q 50 20 70 50 Q 50 80 30 50" fill="#D4E149" />
                <circle cx="50" cy="50" r="10" fill="#000" />
            </svg>
            
            <div class="headline-content">
                Personality
            </div>

            <div class="body-text">
                Recognize who your audience is on the same deep level you already know your close friends and who they really are
            </div>
        </div>
        
        <div class="footer">
            <div class="swipe-text">Swipe for more</div>
            <div class="swipe-icon">
                <svg class="hand-pointer" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
                        <path d="M104,136 V56 a20,20 0 0 1 40,0 v48 M144,96 v-12 a20,20 0 0 1 40,0 v32 M184,104 v-8 a20,20 0 0 1 40,0 v48 c0,32 -20,64 -48,64 H128 C88,208 64,176 64,144 L44,112 a20,20 0 0 1 32,-20 L104,136" />
                    </g>
                    <path d="M124,16 V32 M80,36 L92,48 M168,36 L156,48" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
                </svg>
                <div class="arrow-circle">
                    <svg viewBox="0 0 24 24">
                        <path d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
