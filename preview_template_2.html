<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Marker Prototype (Template 2)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Instrument Serif for elegant headlines, DM Sans for clean body text -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #333;
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        /* 
         * SLIDE CONTAINER (1080x1080)
         * New Vibe: Elegant, minimal, editorial
         */
        .slide {
            width: 1080px;
            height: 1080px;
            background-color: #FCFBFA; /* Very light warm off-white */
            position: relative;
            overflow: hidden;
            color: #2D3130; /* Soft dark grey/black for text */
        }

        /* 
         * EYEBROW / TOP LABEL
         * Centered, spaced out sans-serif
         */
        .eyebrow {
            position: absolute;
            top: 90px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.25em;
            color: #2D3130;
            text-transform: uppercase;
        }

        /* 
         * CONTENT WRAPPER 
         */
        .content {
            position: absolute;
            top: 260px;
            left: 120px;
            width: 840px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            z-index: 10;
        }
        
        .content.centered {
            align-items: center;
            text-align: center;
            top: 220px;
        }

        /* 
         * NUMBER BADGE (Slide 2)
         */
        .number-badge {
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 55px;
            color: #2D3130;
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Hand-drawn circle SVG overlay */
        .marker-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180%;
            height: 160%;
            z-index: 0;
            pointer-events: none;
        }

        /* 
         * HEADLINES
         */
        .headline {
            font-family: 'Instrument Serif', serif;
            font-size: 135px;
            line-height: 1.05;
            font-weight: 400;
            color: #2D3130;
            position: relative;
            z-index: 10;
        }
        
        .headline.smaller {
            font-size: 110px;
            margin-bottom: 10px;
        }

        /* Inline marker highlight (simulated with relative positioning and SVG) */
        .marker-text {
            position: relative;
            display: inline-block;
        }
        .marker-text svg {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140%;
            height: 140%;
            z-index: -1; /* Goes behind text */
        }

        /* 
         * SUBHEAD (Slide 1)
         */
        .subhead {
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 32px;
            letter-spacing: 0.05em;
            color: #4A4E4D;
            text-transform: uppercase;
            margin-top: 20px;
        }

        /* 
         * BODY TEXT (Slide 2)
         */
        .body-text {
            font-family: 'DM Sans', sans-serif;
            font-size: 42px;
            font-weight: 400;
            color: #4A4E4D;
            line-height: 1.5;
            text-align: left;
        }

        /* 
         * BOTTOM RIGHT PILL BUTTON
         */
        .pill-btn {
            position: absolute;
            bottom: 80px;
            right: 80px;
            background-color: #D2FA5C; /* Bright lime green */
            border: 4px solid #111;
            border-radius: 60px;
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pill-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #111;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <!-- SLIDE 1: THE HOOK -->
    <div class="slide">
        <div class="eyebrow">SOCIAL MEDIA 101</div>

        <div class="content">
            <div class="headline">
                You Should 
                <span class="marker-text">
                    Not
                    <!-- Hand-drawn circle SVG -->
                    <svg viewBox="0 0 100 60" preserveAspectRatio="none">
                        <path d="M 50, 5 C 75, 6 95, 20 92, 35 C 90, 50 65, 55 50, 55 C 30, 55 5, 45 8, 30 C 10, 15 35, 8 50, 8" 
                              fill="none" stroke="#D2FA5C" stroke-width="4" stroke-linecap="round" />
                    </svg>
                </span><br>
                Post on Social<br>
                Media Every Day
            </div>
            
            <div class="subhead">WHAT YOU SHOULD DO INSTEAD</div>
        </div>

        <div class="pill-btn">
            <svg viewBox="0 0 24 24">
                <path d="M9 5l7 7-7 7" />
            </svg>
        </div>
    </div>


    <!-- SLIDE 2: THE CONTENT -->
    <div class="slide">
        <div class="eyebrow">SOCIAL MEDIA 101</div>

        <div class="content">
            <!-- Circled Number -->
            <div style="text-align: center;">
                <div class="number-badge">
                    01
                    <svg class="marker-circle" viewBox="0 0 100 60" preserveAspectRatio="none">
                        <path d="M 50, 8 C 80, 8 92, 22 88, 38 C 85, 52 65, 55 50, 55 C 25, 55 10, 42 12, 28 C 15, 12 35, 10 50, 10" 
                              fill="none" stroke="#D2FA5C" stroke-width="4" stroke-linecap="round" />
                    </svg>
                </div>
            </div>
            
            <div class="headline smaller" style="text-align: center;">
                Prioritize Quality
            </div>

            <div class="body-text">
                Instead of daily posts, focus on crafting engaging, valuable content for your audience. Quality content drives better engagement and a positive impact.
            </div>
        </div>
        
        <div class="pill-btn">
            <svg viewBox="0 0 24 24">
                <path d="M9 5l7 7-7 7" />
            </svg>
        </div>
    </div>

</body>
</html>
